name: Deploy Portfolio + DémoVitrine

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Portfolio and DémoVitrine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/demovitrine/package-lock.json

      - name: Install DémoVitrine dependencies
        working-directory: project/demovitrine
        run: npm ci

      - name: Build DémoVitrine
        working-directory: project/demovitrine
        run: npm run build

      - name: Prepare Pages directory
        run: |
          mkdir -p _site

          # Portfolio
          cp index.html _site/
          cp generic.html _site/
          cp elements.html _site/

          if [ -d assets ]; then
            cp -r assets _site/assets
          fi

          if [ -d images ]; then
            cp -r images _site/images
          fi

          # DémoVitrine
          mkdir -p _site/project/demovitrine
          cp -r project/demovitrine/dist/. _site/project/demovitrine/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4